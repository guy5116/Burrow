version: "2"
linters:
  default: standard
  enable:
    - depguard
    - gosec
    - errorlint
    - bodyclose
    - noctx
  settings:
    depguard:
      rules:
        leaf:
          list-mode: strict
          files: ["**/internal/wire/**", "**/internal/secret/**", "**/internal/buf/**"]
          allow: ["$gostd", "github.com/guy5116/burrow/internal/wire", "github.com/guy5116/burrow/internal/secret", "github.com/guy5116/burrow/internal/buf"]
        text:
          list-mode: strict
          files: ["**/internal/text/**"]
          allow: ["$gostd", "golang.org/x/text", "github.com/guy5116/burrow/internal/text"]
        xcrypto:
          list-mode: lax
          files: ["**/internal/**"]
          deny:
            - pkg: "golang.org/x/crypto"
              desc: "x/crypto only in identity, invite, handshake, session, store, media (CLAUDE.md §2.2)"
        xcrypto-ok:
          list-mode: lax
          files: ["**/internal/identity/**", "**/internal/invite/**", "**/internal/handshake/**", "**/internal/session/**", "**/internal/store/**", "**/internal/media/**"]
          allow: ["golang.org/x/crypto"]
        ui:
          list-mode: lax
          files: ["**/internal/ui/**", "**/cmd/**"]
          deny:
            - pkg: "github.com/guy5116/burrow/internal/session"
              desc: "UIs import only internal/core (§2.2)"
            - pkg: "github.com/guy5116/burrow/internal/handshake"
              desc: "UIs import only internal/core (§2.2)"
            - pkg: "github.com/guy5116/burrow/internal/transport"
              desc: "UIs import only internal/core (§2.2)"
            - pkg: "github.com/guy5116/burrow/internal/wire"
              desc: "UIs import only internal/core (§2.2)"
        allowlist:
          list-mode: strict
          files: ["$all"]
          allow:
            - "$gostd"
            - "github.com/guy5116/burrow"
            - "golang.org/x/crypto"
            - "golang.org/x/image"
            - "golang.org/x/text"
            - "golang.org/x/term"
            - "golang.org/x/sys"
            - "golang.org/x/net/dns/dnsmessage"
            - "github.com/flynn/noise"
            - "github.com/charmbracelet/bubbletea/v2"
            - "github.com/charmbracelet/lipgloss/v2"
            - "github.com/charmbracelet/bubbles/v2"
            - "fyne.io/fyne/v2"
            - "github.com/skip2/go-qrcode"
            - "github.com/BurntSushi/toml"
            - "github.com/cretz/bine"
            - "go.uber.org/goleak"
            - "github.com/awnumar/memguard"
        unsafe:
          list-mode: lax
          files: ["**/internal/**"]
          deny:
            - pkg: "unsafe"
              desc: "never on the wire path (§1.3)"
            - pkg: "math/rand"
              desc: "crypto/rand only (§1.3)"
    gosec:
      excludes:
        - G304 # file paths are ours, validated in store
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck]
