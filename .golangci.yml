version: "2"
linters:
  default: standard
  enable:
    - depguard
    - gosec
    - errorlint
    - bodyclose
    - noctx
  settings:
    depguard:
      rules:
        leaf:
          list-mode: strict
          files: ["**/internal/wire/**", "**/internal/secret/**", "**/internal/buf/**"]
          allow: ["$gostd", "github.com/guy5116/burrow/internal/wire", "github.com/guy5116/burrow/internal/secret", "github.com/guy5116/burrow/internal/buf"]
        text:
          list-mode: strict
          files: ["**/internal/text/**"]
          allow: ["$gostd", "golang.org/x/text", "github.com/guy5116/burrow/internal/text"]
        xcrypto:
          list-mode: lax
          files:
            - "**/internal/**"
            - "**/cmd/**"
            - "!**/internal/identity/**"
            - "!**/internal/invite/**"
            - "!**/internal/handshake/**"
            - "!**/internal/session/**"
            - "!**/internal/store/**"
            - "!**/internal/media/**"
            - "!**/internal/testpeer/**" # test-only independent reimplementation
          deny:
            - pkg: "golang.org/x/crypto"
              desc: "x/crypto only in identity, invite, handshake, session, store, media (CLAUDE.md §2.2)"
        ui:
          # The UIs use the engine (core), their shared config and paths
          # (store) and, in cmd, secret for wiping prompts: nothing else.
          list-mode: lax
          files: ["**/internal/ui/**", "**/cmd/**"]
          deny:
            - pkg: "github.com/guy5116/burrow/internal/session"
              desc: "UIs import only internal/core (§2.2)"
            - pkg: "github.com/guy5116/burrow/internal/handshake"
              desc: "UIs import only internal/core (§2.2)"
            - pkg: "github.com/guy5116/burrow/internal/transport"
              desc: "UIs import only internal/core (§2.2)"
            - pkg: "github.com/guy5116/burrow/internal/wire"
              desc: "UIs import only internal/core (§2.2)"
            - pkg: "github.com/guy5116/burrow/internal/identity"
              desc: "UIs import only internal/core (§2.2)"
            - pkg: "github.com/guy5116/burrow/internal/invite"
              desc: "UIs import only internal/core (§2.2)"
            - pkg: "github.com/guy5116/burrow/internal/media"
              desc: "UIs import only internal/core (§2.2)"
            - pkg: "github.com/guy5116/burrow/internal/text"
              desc: "UIs import only internal/core (§2.2); core sanitizes"
            - pkg: "github.com/guy5116/burrow/internal/buf"
              desc: "UIs import only internal/core (§2.2)"
            - pkg: "github.com/guy5116/burrow/internal/testpeer"
              desc: "test tool for the protocol layers"
        protocol:
          # session and handshake know nothing about images, contacts,
          # transports or UIs (§2.2).
          list-mode: lax
          files: ["**/internal/session/**", "**/internal/handshake/**"]
          deny:
            - pkg: "github.com/guy5116/burrow/internal/core"
              desc: "§2.2"
            - pkg: "github.com/guy5116/burrow/internal/media"
              desc: "§2.2"
            - pkg: "github.com/guy5116/burrow/internal/store"
              desc: "§2.2"
            - pkg: "github.com/guy5116/burrow/internal/invite"
              desc: "§2.2"
            - pkg: "github.com/guy5116/burrow/internal/transport"
              desc: "§2.2: they see only net.Conn"
            - pkg: "github.com/guy5116/burrow/internal/ui"
              desc: "§2.2"
        xsys:
          list-mode: lax
          files:
            - "**/internal/**"
            - "!**/internal/store/**"
            - "!**/internal/transport/**"
          deny:
            - pkg: "golang.org/x/sys"
              desc: "x/sys only in store, transport and cmd (CLAUDE.md §14)"
        allowlist:
          list-mode: strict
          files: ["$all"]
          allow:
            - "$gostd"
            - "go/" # go/ast, go/types… (stdlib; $gostd misses them in the $all rule)
            - "github.com/guy5116/burrow"
            - "golang.org/x/crypto"
            - "golang.org/x/image"
            - "golang.org/x/text"
            - "golang.org/x/term"
            - "golang.org/x/sys"
            - "golang.org/x/net/dns/dnsmessage"
            - "github.com/flynn/noise"
            - "charm.land/bubbletea/v2"
            - "charm.land/lipgloss/v2"
            - "charm.land/bubbles/v2"
            - "fyne.io/fyne/v2"
            - "github.com/skip2/go-qrcode"
            - "github.com/BurntSushi/toml"
            - "github.com/cretz/bine"
            - "go.uber.org/goleak"
            - "github.com/awnumar/memguard"
        unsafe:
          list-mode: lax
          files: ["**/internal/**"]
          deny:
            - pkg: "unsafe"
              desc: "never on the wire path (§1.3)"
            - pkg: "math/rand"
              desc: "crypto/rand only (§1.3)"
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gosec:
      excludes:
        - G304 # file paths are ours, validated in store
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck]
