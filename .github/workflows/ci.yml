name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev
      - run: make build
      - run: make cross
      - run: make test
      - run: make build-gui
      - run: make test-gui
      - name: memguard build (identity key in locked memory)
        run: |
          go build -tags memguard ./cmd/burrow
          go test -race -count=1 -short -tags memguard ./internal/identity ./internal/handshake ./internal/session ./internal/core
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: make tools
      - run: make lint
      - run: make docs-check
      - run: ./scripts/cover.sh
  bench:
    # The 15 % rule (CLAUDE.md §11) compares like with like: the base branch and the
    # pull request are measured on the same runner in the same job.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - name: baseline from the base branch
        run: |
          git checkout --quiet ${{ github.event.pull_request.base.sha }}
          go run ./bench/cmp -baseline /tmp/baseline.json -update -- go test -run '^$' -bench . -benchmem ./internal/session ./internal/media ./internal/handshake
          git checkout --quiet ${{ github.event.pull_request.head.sha }}
      - name: compare the pull request
        run: go run ./bench/cmp -baseline /tmp/baseline.json -- go test -run '^$' -bench . -benchmem ./internal/session ./internal/media ./internal/handshake
  fuzz-nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: make fuzz FUZZTIME=10m
