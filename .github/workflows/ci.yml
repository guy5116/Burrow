name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev
      - run: make build
      - run: make cross
      - run: make test
      - run: make build-gui
      - run: make test-gui
      - name: memguard build (identity key in locked memory)
        run: |
          go build -tags memguard ./cmd/burrow
          go test -race -count=1 -short -tags memguard ./internal/identity ./internal/handshake ./internal/session ./internal/core
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: make tools
      - run: make lint
      - run: make docs-check
      - run: ./scripts/cover.sh
  fuzz-nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: make fuzz FUZZTIME=10m
